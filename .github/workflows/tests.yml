name: Tests

on: [ push, pull_request ]

jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        php: [ "8.2", "8.3", "8.4", "8.5" ]
        laravel: [ "12", "13" ]
        composer-dependency: [ prefer-stable, prefer-lowest ]
        exclude:
          - php: "8.2"
            laravel: "13"
          - php: "8.3"
            composer-dependency: prefer-lowest
          - php: "8.4"
            composer-dependency: prefer-lowest
          - php: "8.5"
            composer-dependency: prefer-lowest

    name: "PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.composer-dependency }}"

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-scripts --no-progress --prefer-dist --${{ matrix.composer-dependency }} --with "illuminate/support:^${{ matrix.laravel }}.0"

      - name: Execute tests
        run: vendor/bin/phpunit
